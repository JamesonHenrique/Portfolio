name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: "false"
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit tests
        run: |
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable)"
          chrome_root="$(mktemp -d "$RUNNER_TEMP/karma-chrome.XXXXXX")"
          mkdir -p "$chrome_root/config" "$chrome_root/cache" "$chrome_root/data"
          env -u CHROME_CONFIG_HOME -u CHROME_USER_DATA_DIR \
            CHROME_BIN="$chrome_bin" XDG_CONFIG_HOME="$chrome_root/config" \
            XDG_CACHE_HOME="$chrome_root/cache" XDG_DATA_HOME="$chrome_root/data" \
            npm run test:ci
      - name: Build (prerender)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: portfolio/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
