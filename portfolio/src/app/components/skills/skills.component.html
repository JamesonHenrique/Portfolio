<section id="skills" class="ed-section">
  <div class="ed-container">
    <header class="ed-section-header">
      <div>
        <div class="ed-section-kicker">
          <span class="ed-index">{{ c().skills.index }}</span>
          <span>{{ c().skills.kicker }}</span>
        </div>
        <h2 class="ed-section-title">{{ c().skills.title }}</h2>
      </div>
      <p class="ed-section-lead">{{ c().skills.lead }}</p>
    </header>

    <div class="capabilities-grid">
      @for (group of c().skills.groups; track group.index) {
        <article class="capability-card ed-surface">
          <div class="capability-head">
            <span class="ed-index">{{ group.index }}</span>
            <h3 class="capability-title">{{ group.title }}</h3>
          </div>

          <p class="capability-context">{{ group.context }}</p>

          <ul class="capability-tags" [attr.aria-label]="group.title">
            @for (item of group.items; track item) {
              <li class="ed-tag">{{ item }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
