<section
  id="skills"
  class="py-20 px-4 relative bg-black overflow-hidden"
  #skillsSection
>
  <div
    class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-purple-900/10 to-transparent"
    [class.animate-pulse-slow]="isVisible"
  ></div>

  <div class="container mx-auto relative z-10">
    <div class="text-center mb-16" [class.skills-animated]="isVisible">
      <h2
        class="text-4xl max-[440px]:text-3xl md:text-6xl font-press text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-purple-500 mb-4 title-text"
      >
        STACK
      </h2>
      <div
        class="w-32 h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent mx-auto title-line"
      ></div>
    </div>

    <div class="grid md:grid-cols-2 gap-8" [class.skills-animated]="isVisible">
      @for (group of groups; track group.title; let i = $index) {
        <div class="relative group skill-card" [style.animation-delay]="0.2 + i * 0.15 + 's'">
          <div
            class="absolute -inset-1 bg-gradient-to-r from-purple-600 to-purple-900 rounded-xl blur opacity-50 group-hover:opacity-90 transition-all duration-500"
          ></div>
          <div
            class="relative bg-gradient-to-br from-stone-950 bg-black rounded-xl p-6 sm:p-8 border border-purple-900/50 h-full"
          >
            <h3 class="text-base sm:text-lg font-press text-purple-300 skill-title leading-relaxed mb-6">
              {{ group.title }}
            </h3>
            <ul class="flex flex-wrap gap-3">
              @for (item of group.items; track item) {
                <li class="skill-chip">{{ item }}</li>
              }
            </ul>
          </div>
        </div>
      }

      <div class="md:col-span-2">
        <div
          class="bg-black/50 backdrop-blur-sm rounded-xl p-6 sm:p-8 border border-purple-800/30 tools-card"
          [style.animation-delay]="'0.8s'"
        >
          <h3 class="text-base sm:text-lg font-press text-center text-purple-200 mb-6 tools-title leading-relaxed">
            SISTEMAS QUE JÁ INTEGREI
          </h3>
          <ul class="flex flex-wrap justify-center gap-3">
            @for (system of integratedSystems; track system) {
              <li class="skill-chip">{{ system }}</li>
            }
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
