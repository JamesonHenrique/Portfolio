<section id="sobre" class="about-band" [attr.aria-labelledby]="'about-heading'">
  <div class="ed-container about-layout">
    <div class="ed-section-label">{{ c().about.sectionLabel }}</div>

    <div class="about-main">
      <div>
        <h2 id="about-heading">
          {{ c().about.headingPre }}<br /><em>{{ c().about.headingEm }}</em
          ><br />{{ c().about.headingPost }}
        </h2>

        <p class="about-intro">{{ c().about.shortBio }}</p>

        <div class="about-links">
          <a href="https://github.com/JamesonHenrique" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
          <a href="https://www.linkedin.com/in/jamesonhenrique/" target="_blank" rel="noopener noreferrer"
            >LinkedIn ↗</a
          >
          <a href="/JAMESON_HENRIQUE_CV.pdf" target="_blank" rel="noopener noreferrer">{{ c().about.cvLink }} ↗</a>
        </div>
      </div>

      <figure class="polaroid">
        <img src="/about-me.jpg" width="200" height="200" [alt]="c().about.photoAlt" />
        <figcaption>{{ c().about.photoCaption }}</figcaption>
      </figure>
    </div>
  </div>
</section>
