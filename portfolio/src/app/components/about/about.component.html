<section id="sobre" class="section overflow-hidden" #aboutSection>
  <div class="about-shape w-96 h-96 shape-blob -right-60 -top-40" aria-hidden="true"></div>

  <div class="container mx-auto max-w-6xl relative">
    <h2 class="section-title">{{ c().about.title }}</h2>

    <div class="about-layout" [class.about-visible]="isVisible">
      <div class="about-intro">
        <div class="about-profile">
          <img src="about-me.jpg" [alt]="c().about.photoAlt" width="112" height="112" class="about-photo" />
          <div>
            <span class="about-eyebrow">{{ c().hero.badge }}</span>
            <p class="about-name">Jameson Henrique</p>
          </div>
        </div>

        <p class="about-lead">{{ c().about.intro }}</p>
        <p class="about-detail">{{ c().about.detail }}</p>
        <a class="about-link" href="/JAMESON_HENRIQUE_CV.pdf" download="JAMESON_HENRIQUE_CV.pdf">
          {{ c().about.cvLink }} <span aria-hidden="true">↗</span>
        </a>
      </div>

      <div class="about-highlights">
        <div class="about-highlight">
          <span class="highlight-number" aria-hidden="true">01</span>
          <div>
            <h3>{{ c().about.educationLabel }}</h3>
            <p>{{ c().about.education }}</p>
          </div>
        </div>
        <div class="about-highlight">
          <span class="highlight-number" aria-hidden="true">02</span>
          <div>
            <h3>{{ c().about.workLabel }}</h3>
            <p>{{ c().about.work }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
