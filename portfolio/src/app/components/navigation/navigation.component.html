<nav
  [attr.aria-label]="c().nav.aria"
  class="fixed right-1 sm:right-6 top-1/2 -translate-y-1/2 z-40 flex flex-col gap-3 sm:gap-4"
>
  @for (dot of dots; track dot.id) {
    <a
      [routerLink]="c().home"
      [fragment]="dot.id"
      [attr.aria-label]="c().nav[dot.label]"
      [attr.title]="c().nav[dot.label]"
      [class]="'nav-dot block w-2.5 h-2.5 sm:w-4 sm:h-4 ' + dot.shape"
    ></a>
  }
</nav>
