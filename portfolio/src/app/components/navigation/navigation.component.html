<header class="site-header">
  <div class="ed-container header-inner">
    <a [routerLink]="c().home" class="brand" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">Jh</span>
      <span class="brand-name">JAMESON<br />HENRIQUE</span>
    </a>

    <nav [attr.aria-label]="c().nav.aria" class="desktop-nav">
      @for (item of links; track item.id) {
        <a
          [routerLink]="c().home"
          [fragment]="item.id"
          class="nav-item"
          [class.nav-item-active]="activeSection() === item.id"
          [attr.aria-current]="activeSection() === item.id ? 'location' : null"
        >
          {{ c().nav[item.label] }}
        </a>
      }
    </nav>

    <div class="header-actions">
      <a
        [routerLink]="otherLangPath()"
        class="lang-switch"
        [attr.aria-label]="c().switchAria"
        [attr.hreflang]="c().lang === 'pt' ? 'en' : 'pt-BR'"
      >
        <span [class.lang-active]="c().lang === 'pt'">PT</span>
        <span class="lang-sep" aria-hidden="true">/</span>
        <span [class.lang-active]="c().lang === 'en'">EN</span>
      </a>

      <button
        type="button"
        class="inspect-toggle desktop-inspect"
        [attr.aria-pressed]="inspection.enabled()"
        [attr.aria-label]="c().nav.inspectAria"
        (click)="inspection.toggle()"
      >
        {{ inspection.enabled() ? c().nav.inspectClose : c().nav.inspectLabel }}
      </button>

      <button
        type="button"
        class="menu-toggle"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav-panel"
        [attr.aria-label]="menuOpen() ? c().nav.menuClose : c().nav.menuOpen"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (inspection.enabled()) {
    <div class="inspect-bar" role="status" aria-live="polite">
      <div class="ed-container inspect-bar-inner">
        <span>{{ c().nav.inspectStatus }}</span>
        <button type="button" class="inspect-bar-close" (click)="inspection.set(false)">
          {{ c().nav.inspectClose }}
        </button>
      </div>
    </div>
  }

  <div class="reading-progress" [style.transform]="'scaleX(' + scrollProgress() + ')'" aria-hidden="true"></div>

  @if (menuOpen()) {
    <nav id="mobile-nav-panel" [attr.aria-label]="c().nav.aria" class="mobile-nav">
      <div class="ed-container mobile-nav-inner">
        @for (item of links; track item.id) {
          <a
            [routerLink]="c().home"
            [fragment]="item.id"
            class="mobile-nav-item"
            [class.mobile-nav-item-active]="activeSection() === item.id"
            [attr.aria-current]="activeSection() === item.id ? 'location' : null"
            (click)="closeMenu()"
          >
            {{ c().nav[item.label] }}
          </a>
        }
        <div class="mobile-inspect-row">
          <button
            type="button"
            class="inspect-toggle mobile-inspect"
            [attr.aria-pressed]="inspection.enabled()"
            [attr.aria-label]="c().nav.inspectAria"
            (click)="inspection.toggle(); closeMenu()"
          >
            {{ inspection.enabled() ? c().nav.inspectClose : c().nav.inspectLabel }}
          </button>
        </div>
      </div>
    </nav>
  }
</header>
