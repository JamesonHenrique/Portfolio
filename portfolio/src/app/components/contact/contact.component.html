<section id="contato" class="outro-band" [attr.aria-labelledby]="'contact-heading'">
  <div class="ed-container">
    <div class="ed-section-label">{{ c().contact.sectionLabel }}</div>

    <h2 id="contact-heading">
      {{ c().contact.headingPre }}<br /><em>{{ c().contact.headingEm }}</em>
    </h2>

    <div class="outro-bar">
      <a class="outro-mail" [href]="'mailto:' + emailAddress">
        <strong>{{ emailAddress }}</strong>
        <span aria-hidden="true">↗</span>
      </a>

      <button type="button" class="outro-copy" (click)="copyEmail()">
        {{ copied() ? c().contact.copiedEmail : c().contact.copyEmail }}
      </button>
    </div>

    <div class="outro-meta">
      <a [routerLink]="c().home" fragment="inicio" class="back-top">{{ c().contact.backToTop }}</a>
    </div>
  </div>
</section>
