<footer class="site-footer">
  <div class="ed-container footer-inner">
    <div class="footer-brand">
      <strong>Jameson Henrique</strong>
      <span class="mono-meta">{{ c().footer.role }}</span>
    </div>

    <div class="footer-links">
      <a href="/JAMESON_HENRIQUE_CV.pdf" target="_blank" rel="noopener noreferrer">{{ c().footer.cv }}</a>
      <a href="https://github.com/JamesonHenrique" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/jamesonhenrique/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a [routerLink]="otherLangPath()" class="lang-link" [attr.hreflang]="c().lang === 'pt' ? 'en' : 'pt-BR'">
        {{ c().switchLabel }}
      </a>
    </div>

    <p class="mono-meta footer-copy">© {{ currentYear }} Jameson Henrique · {{ c().footer.rights }}</p>
  </div>
</footer>
