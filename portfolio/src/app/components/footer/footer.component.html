<footer id="footer" class="site-footer">
  <div class="ed-container footer-inner">
    <div class="footer-brand">
      <a [routerLink]="c().home" class="footer-name">Jameson Henrique</a>
      <p class="mono-meta">{{ c().footer.role }}</p>
    </div>

    <nav class="footer-nav" [attr.aria-label]="c().nav.aria">
      @for (link of links; track link.id) {
        <a [routerLink]="c().home" [fragment]="link.id" class="footer-link">{{ c().nav[link.label] }}</a>
      }
      <a href="/JAMESON_HENRIQUE_CV.pdf" download="JAMESON_HENRIQUE_CV.pdf" class="footer-link">{{ c().footer.cv }}</a>
      <a
        [routerLink]="otherLangPath()"
        class="footer-link footer-lang"
        [attr.aria-label]="c().switchAria"
        [attr.hreflang]="c().lang === 'pt' ? 'en' : 'pt-BR'"
      >
        {{ c().switchLabel }}
      </a>
    </nav>

    <div class="footer-meta">
      <p class="mono-meta">© {{ currentYear }} Jameson Henrique. {{ c().footer.rights }}</p>
    </div>
  </div>
</footer>
